name: Update HK CANSLIM CCASS Dashboard

on:
  schedule:
    # 星期一至五 09:00 HKT（開市前，抓取最新 T+2 CCASS / 北水數據）
    - cron: '0 1 * * 1-5'
    # 星期一至五 16:30 HKT（收市後，更新收市價、均線與成交量排雷）
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 容許手動按掣即時測試

permissions:
  contents: write # 必須開啟，否則無法自動把 index.html 寫回 Repo

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CANSLIM CCASS Scanner
        run: python scanner.py

      - name: Commit and push updated dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update dashboard" && git push)
